<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Админ-панель | Управление новостями</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
    <script src="/js/theme-toggle.js"></script>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<div class="container my-5">
    <div class="row g-5">
        <!-- Левая колонка: Форма добавления новости -->
        <div class="col-md-4">
            <div class="card p-4 shadow-sm bg-body border">
                <h4 class="mb-3 fw-bold">📢 Создать новость</h4>
                <form th:action="@{/admin/news/create}" method="post">
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Заголовок новости</label>
                        <input type="text" name="title" class="form-control" required placeholder="Например: Добавлена новая игра!">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Тип оповещения</label>
                        <select name="type" class="form-select">
                            <option value="INFO">INFO (Синий цвет)</option>
                            <option value="SUCCESS">SUCCESS (Зеленый цвет)</option>
                            <option value="ALERT">ALERT (Красный цвет — поломки/акции)</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Содержание</label>
                        <textarea name="content" class="form-control" rows="5" required placeholder="Текст объявления..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Опубликовать</button>
                </form>
            </div>
        </div>

        <!-- Правая колонка: Список опубликованных новостей -->
        <div class="col-md-8">
            <h4 class="mb-3 fw-bold">📋 Список текущих публикаций</h4>

            <div th:if="${#lists.isEmpty(newsList)}" class="alert alert-secondary text-center">
                Новостей в базе данных пока нет. Лента пуста.
            </div>

            <div th:unless="${#lists.isEmpty(newsList)}" class="table-responsive border rounded bg-body shadow-sm">
                <table class="table table-striped table-hover align-middle mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th>Заголовок</th>
                        <th>Тип</th>
                        <th>Дата публикации</th>
                        <th class="text-end">Действие</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="news : ${newsList}">
                        <td class="fw-semibold" th:text="${news.title}"></td>
                        <td>
                                    <span class="badge"
                                          th:classappend="${news.type == 'ALERT' ? 'bg-danger' : (news.type == 'SUCCESS' ? 'bg-success' : 'bg-primary')}"
                                          th:text="${news.type}"></span>
                        </td>
                        <td th:text="${#temporals.format(news.publishedAt, 'dd.MM.yyyy HH:mm')}"></td>
                        <td class="text-end">
                            <form th:action="@{/admin/news/{id}/delete(id=${news.id})}" method="post"
                                  onsubmit="return confirm('Вы действительно хотите безвозвратно удалить эту новость?');" class="d-inline">
                                <button type="submit" class="btn btn-sm btn-outline-danger py-0 px-2">Удалить</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
