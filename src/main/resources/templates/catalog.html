<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Игромания | Каталог</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
    <script src="/js/theme-toggle.js"></script>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<div class="container my-5">
    <h2 class="mb-4 text-center">🎯 Наши игровые зоны и библиотеки игр</h2>

    <div th:if="${#lists.isEmpty(zones)}" class="alert alert-warning text-center">
        Каталог пуст. Администратор ещё не добавил игровые зоны.
    </div>

    <div class="row row-cols-1 row-cols-md-2 g-4">
        <div th:each="zone : ${zones}" class="col">
            <div class="card h-100 shadow-sm border border-secondary-subtle">
                <div class="card-header bg-body-secondary d-flex justify-content-between align-items-center">
                    <h4 class="my-0 fw-normal" th:text="${zone.name}"></h4>
                    <span class="badge bg-primary fs-6" th:text="${zone.pricePerHour + ' ₽/час'}"></span>
                </div>
                <div class="card-body">
                    <p class="card-text text-muted mb-2"><strong>Оборудование:</strong> <span th:text="${zone.specifications}"></span></p>
                    <h6 class="border-top pt-2">Доступные игры в этой зоне:</h6>

                    <ul class="list-group list-group-flush mb-3">
                        <li th:each="game : ${zone.games}" class="list-group-item d-flex justify-content-between align-items-start px-0 bg-transparent">
                            <div class="ms-2 me-auto">
                                <div class="fw-bold" th:text="${game.title}"></div>
                                <small class="text-muted" th:text="${game.genre}"></small>
                            </div>
                            <span class="badge bg-secondary rounded-pill" th:text="${game.minAge + '+'}"></span>
                        </li>
                        <li th:if="${#lists.isEmpty(zone.games)}" class="list-group-item px-0 bg-transparent text-muted small">В этой зоне пока нет установленных игр</li>
                    </ul>
                </div>
                <div class="card-footer bg-transparent border-0 pb-3">
                    <a th:href="@{/booking/new(zoneId=${zone.id})}" class="btn btn-outline-primary w-100">Забронировать эту зону</a>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
