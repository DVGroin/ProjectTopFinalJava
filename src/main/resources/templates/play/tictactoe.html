<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Игромания | Крестики-Нолики</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
    <script src="/js/theme-toggle.js"></script>
    <style>
        .tic-grid {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-gap: 8px;
            justify-content: center;
        }
        .tic-box {
            width: 100px;
            height: 100px;
            font-size: 2.8rem;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--card-glass-border) !important;
            background: rgba(15, 23, 42, 0.4) !important;
            border-radius: 12px;
            transition: all 0.2s ease;
        }
        .tic-box:hover {
            border-color: var(--accent-cyan) !important;
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.4);
            background: rgba(15, 23, 42, 0.6) !important;
        }
    </style>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<div class="container my-5 text-center" style="max-width: 500px;">
    <h2 class="fw-bold mb-3" style="color: var(--accent-cyan); text-shadow: 0 0 10px rgba(6, 182, 212, 0.3);">❌ Крестики-Нолики ⭕</h2>
    <p class="text-muted small mb-4">Классическая мини-игра для проверки интерфейса прямо в браузере.</p>

    <div class="card p-4 shadow-sm bg-body">
        <h4 id="statusDisplay" class="mb-4 fw-bold" style="color: var(--accent-mint);">Ход игрока X</h4>

        <div class="tic-grid mb-4">
            <div class="tic-box" data-index="0" onclick="makeMove(this)"></div>
            <div class="tic-box" data-index="1" onclick="makeMove(this)"></div>
            <div class="tic-box" data-index="2" onclick="makeMove(this)"></div>
            <div class="tic-box" data-index="3" onclick="makeMove(this)"></div>
            <div class="tic-box" data-index="4" onclick="makeMove(this)"></div>
            <div class="tic-box" data-index="5" onclick="makeMove(this)"></div>
            <div class="tic-box" data-index="6" onclick="makeMove(this)"></div>
            <div class="tic-box" data-index="7" onclick="makeMove(this)"></div>
            <div class="tic-box" data-index="8" onclick="makeMove(this)"></div>
        </div>

        <button class="btn btn-outline-primary w-100" onclick="resetGame()">Начать заново</button>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<!-- Подключаем внешний файл игровой логики -->
<script src="/js/tictactoe.js"></script>
</body>
</html>
