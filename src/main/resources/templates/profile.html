<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Игромания | Личный кабинет</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
    <script src="/js/theme-toggle.js"></script>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<div class="container my-5">
    <div class="row g-5">
        <div class="col-md-5 col-lg-4">
            <div class="card p-3 shadow-sm mb-4 bg-body">
                <h4 class="mb-3">👤 Мой Профиль</h4>
                <form th:action="@{/profile/edit}" method="post">
                    <div class="mb-3">
                        <label class="form-label text-muted small">Имя аккаунта</label>
                        <input type="text" class="form-control" th:value="${user.username}" disabled>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-muted small">Email</label>
                        <input type="email" name="email" class="form-control" th:value="${user.email}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-muted small">Телефон</label>
                        <input type="text" name="phone" class="form-control" th:value="${user.phone}">
                    </div>
                    <button class="btn btn-sm btn-primary w-100" type="submit">Обновить данные</button>
                </form>
            </div>

            <div class="card p-3 shadow-sm bg-body">
                <h5 class="mb-3">🌓 Настройки темы</h5>
                <div class="d-flex justify-content-between">
                    <button class="btn btn-sm btn-outline-secondary w-100 me-1" onclick="localStorage.setItem('theme', 'light'); location.reload();">☀️ Светлая</button>
                    <button class="btn btn-sm btn-outline-dark w-100 me-1" onclick="localStorage.setItem('theme', 'dark'); location.reload();">🌙 Тёмная</button>
                    <button class="btn btn-sm btn-outline-primary w-100" onclick="localStorage.setItem('theme', 'auto'); location.reload();">💻 Система</button>
                </div>
            </div>
        </div>

        <div class="col-md-7 col-lg-8">
            <h4 class="mb-3">📅 Мои бронирования</h4>

            <div th:if="${#lists.isEmpty(user.bookings)}" class="alert alert-info">
                Вы ещё ничего не бронировали. <a href="/catalog" class="alert-link">Открыть каталог</a>
            </div>

            <div th:unless="${#lists.isEmpty(user.bookings)}" class="table-responsive">
                <table class="table table-striped table-hover align-middle border">
                    <thead class="table-dark">
                    <tr>
                        <th>Объект брони</th>
                        <th>Дата начала</th>
                        <th>Длительность</th>
                        <th>Группа / Ивент</th>
                        <th>Статус</th>
                        <th>Действие</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="booking : ${user.bookings}">
                        <td class="fw-bold" th:text="${booking.game != null ? 'Игра: ' + booking.game.title : 'Зона: ' + booking.gameZone.name}"></td>
                        <td th:text="${#temporals.format(booking.startTime, 'dd.MM.yyyy HH:mm')}"></td>
                        <td th:text="${booking.durationHours + ' ч.'}"></td>
                        <td th:text="${booking.groupEvent != null ? booking.groupEvent.name : 'Индивидуально'}"></td>
                        <td>
                                    <span class="badge"
                                          th:classappend="${booking.status == 'NEW' ? 'bg-primary' : (booking.status == 'IN_PROGRESS' ? 'bg-warning text-dark' : (booking.status == 'COMPLETED' ? 'bg-success' : 'bg-danger'))}"
                                          th:text="${booking.status}"></span>
                        </td>
                        <td>
                            <form th:if="${booking.status == 'NEW'}" th:action="@{/booking/{id}/cancel(id=${booking.id})}" method="post" onsubmit="return confirm('Вы уверены, что хотите отменить бронь?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger py-0 px-2">Отменить</button>
                            </form>
                            <span th:unless="${booking.status == 'NEW'}" class="text-muted small">—</span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
