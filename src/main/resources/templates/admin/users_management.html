<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Админ-панель | Пользователи</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
    <script src="/js/theme-toggle.js"></script>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<div class="container my-5">
    <h4 class="mb-4 fw-bold">👥 Модерация учетных записей и распределение прав</h4>
    <div class="table-responsive border rounded bg-body shadow-sm">
        <table class="table table-striped table-hover align-middle mb-0">
            <thead class="table-dark">
            <tr>
                <th>Логин</th>
                <th>Email</th>
                <th>Телефон</th>
                <th>Роль</th>
                <th>Уровень доступа</th>
                <th th:if="${currentUser.adminLevel == 1}" class="text-end">Назначить уровень</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="u : ${users}">
                <td th:text="${u.username}"></td>
                <td th:text="${u.email}"></td>
                <td th:text="${u.phone ?: '—'}"></td>
                <td th:text="${u.role}"></td>
                <td>
                    <span class="badge bg-secondary" th:text="'Lvl ' + ${u.adminLevel}"></span>
                </td>
                <!-- Управление рангами доступно только Супер-Админу (Lvl 1) -->
                <td th:if="${currentUser.adminLevel == 1}" class="text-end">
                    <form th:action="@{/admin/users/{id}/level(id=${u.id})}" method="post" class="d-inline">
                        <select name="adminLevel" class="form-select form-select-sm d-inline-block w-auto" onchange="this.form.submit()">
                            <option value="0" th:selected="${u.adminLevel == 0}">Игрок (0)</option>
                            <option value="3" th:selected="${u.adminLevel == 3}">Мл. Админ игр (3)</option>
                            <option value="2" th:selected="${u.adminLevel == 2}">Админ зон (2)</option>
                            <option value="1" th:selected="${u.adminLevel == 1}">Супер-Админ (1)</option>
                        </select>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
