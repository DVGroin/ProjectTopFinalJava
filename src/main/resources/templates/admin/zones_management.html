<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Админ-панель | Игровые зоны</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
    <script src="/js/theme-toggle.js"></script>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<div class="container my-5">
    <div class="row g-5">
        <div class="col-md-4">
            <div class="card p-4 shadow-sm bg-body border">
                <h4 class="mb-3 fw-bold">🚪 Создать зону</h4>
                <form th:action="@{/admin/zones/create}" method="post">
                    <div class="mb-3">
                        <label class="form-label small">Название зоны</label>
                        <input type="text" name="name" class="form-control" required placeholder="Например: VR-Комната">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small">Стоимость (за 1 час)</label>
                        <input type="number" name="pricePerHour" class="form-control" min="0" step="50" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small">Спецификация / Оборудование</label>
                        <textarea name="specifications" class="form-control" rows="3" required placeholder="Спецификация железа..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Сохранить структуру</button>
                </form>
            </div>
        </div>
        <div class="col-md-8">
            <h4 class="mb-3 fw-bold">📋 Список оборудованных площадок</h4>
            <div th:if="${#lists.isEmpty(zones)}" class="alert alert-secondary text-center">Площадки отсутствуют.</div>
            <div th:unless="${#lists.isEmpty(zones)}" class="table-responsive border rounded bg-body shadow-sm">
                <table class="table table-striped table-hover align-middle mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th>Зона</th>
                        <th>Оборудование</th>
                        <th>Тариф</th>
                        <th class="text-end">Действие</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="z : ${zones}">
                        <td class="fw-bold" th:text="${z.name}"></td>
                        <td th:text="${z.specifications}"></td>
                        <td th:text="${z.pricePerHour + ' ₽'}"></td>
                        <td class="text-end">
                            <form th:action="@{/admin/zones/{id}/delete(id=${z.id})}" method="post" onsubmit="return confirm('Удалить игровую зону и все связанные с ней игры?');" class="d-inline">
                                <button type="submit" class="btn btn-sm btn-outline-danger py-0 px-2">Удалить</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
