<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Админ-панель | Управление меню</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
    <script src="/js/theme-toggle.js"></script>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<div class="container my-5">
    <!-- Ссылки на подмодули админки с учетом нового меню -->
    <div class="btn-group mb-4 shadow-sm">
        <a href="/admin/dashboard" class="btn btn-outline-primary">Все Бронирования</a>
        <a th:if="${currentUser.adminLevel <= 2}" href="/admin/users" class="btn btn-outline-primary">Пользователи</a>
        <a th:if="${currentUser.adminLevel <= 2}" href="/admin/zones" class="btn btn-outline-primary">Игровые зоны</a>
        <a href="/admin/games" class="btn btn-outline-primary">Каталог игр</a>
        <a href="/admin/menu" class="btn btn-primary active">Меню столовой (Lvl 3)</a>
        <a href="/admin/news" class="btn btn-outline-primary">Управление новостями (Lvl 3)</a>
    </div>

    <div class="row g-5">
        <!-- Форма добавления позиции в меню -->
        <div class="col-md-4">
            <div class="card p-4 shadow-sm bg-body border">
                <h4 class="mb-3 fw-bold">🍔 Добавить блюдо / напиток</h4>
                <form th:action="@{/admin/menu/create}" method="post">
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Название</label>
                        <input type="text" name="name" class="form-control" required placeholder="Например: Комбо-набор 'Геймер'">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Категория</label>
                        <select name="category" class="form-select">
                            <option value="FOOD">🍕 Еда и Снеки</option>
                            <option value="DRINK">🥤 Напитки и Энергетики</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Цена (₽)</label>
                        <input type="number" name="price" class="form-control" min="0" required placeholder="450">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Описание / Состав</label>
                        <textarea name="description" class="form-control" rows="3" required placeholder="Вес, объем, ингредиенты..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-success w-100">Добавить в меню</button>
                </form>
            </div>
        </div>

        <!-- Таблица текущих позиций -->
        <div class="col-md-8">
            <h4 class="mb-3 fw-bold">📋 Текущий ассортимент кухни</h4>

            <div th:if="${#lists.isEmpty(menuItems)}" class="alert alert-secondary text-center">
                В меню пока нет добавленных позиций.
            </div>

            <div th:unless="${#lists.isEmpty(menuItems)}" class="table-responsive border rounded bg-body shadow-sm">
                <table class="table table-striped table-hover align-middle mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th>Название</th>
                        <th>Категория</th>
                        <th>Цена</th>
                        <th>Описание</th>
                        <th class="text-end">Действие</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="item : ${menuItems}">
                        <td class="fw-bold" th:text="${item.name}"></td>
                        <td>
                            <span class="badge" th:classappend="${item.category.name() == 'FOOD' ? 'bg-primary' : 'bg-info text-dark'}" th:text="${item.category}"></span>
                        </td>
                        <td th:text="${item.price + ' ₽'}"></td>
                        <td th:text="${item.description}" class="text-muted small"></td>
                        <td class="text-end">
                            <form th:action="@{/admin/menu/{id}/delete(id=${item.id})}" method="post"
                                  onsubmit="return confirm('Вы действительно хотите удалить эту позицию из меню?');" class="d-inline">
                                <button type="submit" class="btn btn-sm btn-outline-danger py-0 px-2">Удалить</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
