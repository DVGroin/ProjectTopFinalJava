<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Админ-панель | Управление играми</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
    <script src="/js/theme-toggle.js"></script>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<div class="container my-5">
    <div class="row g-5">
        <div class="col-md-4">
            <div class="card p-4 shadow-sm bg-body border">
                <h4 class="mb-3 fw-bold">🎮 Добавить игру</h4>
                <form th:action="@{/admin/games/create}" method="post">
                    <div class="mb-3">
                        <label class="form-label small">Название игры</label>
                        <input type="text" name="title" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small">Жанр</label>
                        <input type="text" name="genre" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small">Возрастной ценз</label>
                        <input type="number" name="minAge" class="form-control" min="0" value="12" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small">Привязать к зоне оборудования</label>
                        <select name="gameZoneId" class="form-select">
                            <option th:each="zone : ${zones}" th:value="${zone.id}" th:text="${zone.name}"></option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-success w-100">Добавить в каталог</button>
                </form>
            </div>
        </div>
        <div class="col-md-8">
            <h4 class="mb-3 fw-bold">📋 Реестр каталога игр</h4>
            <div th:if="${#lists.isEmpty(games)}" class="alert alert-secondary text-center">Библиотека игр пуста.</div>
            <div th:unless="${#lists.isEmpty(games)}" class="table-responsive border rounded bg-body shadow-sm">
                <table class="table table-striped table-hover align-middle mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th>Название</th>
                        <th>Жанр</th>
                        <th>Ценз</th>
                        <th>Игровая зона</th>
                        <th class="text-end">Действие</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="game : ${games}">
                        <td class="fw-bold" th:text="${game.title}"></td>
                        <td th:text="${game.genre}"></td>
                        <td th:text="${game.minAge + '+'}"></td>
                        <td th:text="${game.gameZone.name}"></td>
                        <td class="text-end">
                            <form th:action="@{/admin/games/{id}/delete(id=${game.id})}" method="post" onsubmit="return confirm('Удалить игру из справочника?');" class="d-inline">
                                <button type="submit" class="btn btn-sm btn-outline-danger py-0 px-2">Удалить</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
