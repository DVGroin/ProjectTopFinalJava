<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" xmlns:sec="http://thymeleaf.org/extras/spring-security">
<div th:fragment="header">
    <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="/">🕹️ ИГРОМАНИЯ</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="/">Главная</a></li>
                    <li class="nav-item"><a class="nav-link" href="/catalog">Каталог</a></li>
                    <li class="nav-item"><a class="nav-link" href="/menu">Столовая</a></li>
                    <li class="nav-item"><a class="nav-link" href="/faq">FAQ</a></li>
                    <li class="nav-item"><a class="nav-link" href="/contacts">Контакты</a></li>
                </ul>

                <div class="d-flex align-items-center">
                    <!-- Блок для Гостя (Не авторизован) -->
                    <div sec:authorize="isAnonymous()">
                        <a href="/login" class="btn btn-sm btn-outline-primary me-2">Вход</a>
                        <a href="/register" class="btn btn-sm btn-primary">Регистрация</a>
                    </div>

                    <!-- Блок для Пользователя / Админа -->
                    <div sec:authorize="isAuthenticated()" class="dropdown">
                        <button class="btn btn-sm btn-secondary dropdown-toggle" type="button" id="userMenu" data-bs-toggle="dropdown" aria-expanded="false">
                            👤 <span sec:authentication="name">Username</span>
                            (<span th:text="${#authentication.principal.user.role == 'ROLE_ADMIN' ? 'Админ Lvl ' + #authentication.principal.user.adminLevel : 'Игрок'}"></span>)
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userMenu">
                            <li><a class="dropdown-item" href="/profile">Личный кабинет</a></li>
                            <!-- Ссылка видна только админу любого уровня -->
                            <li sec:authorize="hasRole('ADMIN')">
                                <a class="dropdown-item text-danger fw-bold" href="/admin/dashboard">Панель админа</a>
                            </li>
                            <li><hr class="dropdown-divider"></li>
                            <li>
                                <form th:action="@{/logout}" method="post" class="m-0">
                                    <button type="submit" class="dropdown-item">Выйти</button>
                                </form>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </nav>
    <script src="https://jsdelivr.net"></script>
</div>
</html>
